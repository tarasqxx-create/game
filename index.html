 const oil=Math.ceil(sh*(2.3-.15*l));mz={g,c,r,cs,ox:(W-c*cs)/2,oy:(H-r*cs)/2+24,px:0,py:r-1,vx:0,vy:r-1,ex:c-1,ey:0,oil,mo:oil,gn:Math.ceil(sh*.18),em,sn:Array.from({length:r},()=>Array(c).fill(0)),walk:null,done:0,t:0};mz.sn[r-1][0]=1;

 for(let y=0;y<m.r;y++)for(let x=0;x<m.c;x++){const v=f(x,y);if(v<.02)continue;const c=m.g[y][x],px=m.ox+x*cs,py=m.oy+y*cs;Y.fillStyle='rgba(255,170,70,'+v*.08+')';Y.fillRect(px,py,cs,cs);Y.strokeStyle='rgba(224,150,70,'+v*.95+')';Y.beginPath();
